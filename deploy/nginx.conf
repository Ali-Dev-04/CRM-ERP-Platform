# NGINX reverse proxy for the CRM+ERP platform.
# - Terminates TLS (cert paths are examples; use a real cert/Let's Encrypt).
# - Routes /api/* to the backend and everything else to the Next.js frontend.
# - Applies basic rate limiting and security headers.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # Rate limit zone: 10 req/s per IP.
  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

  upstream backend {
    server backend:4000;
  }
  upstream frontend {
    server frontend:3000;
  }

  server {
    listen 80;
    server_name _;

    # Redirect to TLS in production (comment out for plain dev).
    # return 301 https://$host$request_uri;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 30m; # file uploads (presigned flow keeps it off the API)

    location /api/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://backend/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }

  # server {
  #   listen 443 ssl http2;
  #   server_name your-domain;
  #   ssl_certificate     /etc/nginx/ssl/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/ssl/privkey.pem;
  #   # ... same location blocks as above ...
  # }
}
